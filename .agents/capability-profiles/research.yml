schema_version: 1
task_class: research
description: "Kaynaklı araştırma/keşif — kod değişikliği yok"
skills:
  - research-with-evidence
  - grilling  # opt-in plan sorgusu; dosya yazmaz, read-only sınıra uyar
  # Okuma-niyetli denetim ("güvenlik açısından incele") bu profile iner
  # (incele.py P1, PR #43): denetim bulgu üretir, dosya yazmaz — yazma
  # profili açmadan zorunlu kılınabilmesi için burada kayıtlı olmalı.
  - security-review
tools:
  filesystem: read-only
  report_path: ".agents/reports/"
  commands: [gh]
network:
  mode: open-web
  note: "Web araştırması serbest; indirme/çalıştırma yasak"
evidence_required:
  - cited_sources
risk:
  provisional_from: issue_form
  final_from: diff
  escalation: upward_only

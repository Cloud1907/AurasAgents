schema_version: 1
task_class: code-change
description: "Contract'lı kod değişikliği — sistemin ana iş sınıfı"
skills:
  # Bu küme routing.yml ile CI'da eşleşmek ZORUNDA (validate test_routing):
  # profil izin sınırıdır, routing o sınır içinden seçim yapar.
  - implement-change
  - security-review
  - kernel-work
  - designing-interfaces   # görünür yüzey işi de kod değişikliğidir
  - auras                  # projeyi sisteme bağlamak dosya yazar
  # routing'de yok (not_routed: auras kapsıyor) ama /komutla çağrılabilir;
  # dosya yazdığı için sınırı burada tanımlı olmalı — profilsiz skill,
  # sınıfı tahmine bırakır ve salt-okunur profile düşerse iş sessizce kırılır.
  - project-onboarding
tools:
  filesystem: workspace-write
  commands: [test, lint, build, typecheck, gh]
network:
  mode: allowlist
  domains:
    - api.github.com
evidence_required:
  - tests
  - lint
  - build
risk:
  provisional_from: issue_form
  final_from: diff
  escalation: upward_only
